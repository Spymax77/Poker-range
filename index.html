<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Poker Range | Модульная версия (без сборки)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-card">
        <div class="tabs">
            <button class="tab-btn active" data-page="constructor">Конструктор</button>
            <button class="tab-btn" data-page="work">Работа</button>
        </div>

        <div id="constructorPage" class="page active-page">
            <div class="three-columns">
                <div class="tree-panel">
                    <h3>📁 Дерево узлов</h3>
                    <div id="constructorTree"></div>
                    <button id="addRootNodeBtn" class="add-node-btn">+ Добавить корневой узел</button>
                </div>

                <div class="table-panel">
                    <div class="stats-bar">
                        <div class="stats-left">
                            <div><span id="rangeStats">Комбинаций: 0 / 1326</span></div>
                        </div>
                    </div>
                    <div id="constructorGrid" class="hands-grid"></div>
                    <div id="constructorChildButtons" class="button-bar"></div>
                    <div id="constructorNavButtons" class="button-bar" style="justify-content: space-between;">
                        <button id="backButton" class="btn-oval" style="display: none;">← Назад</button>
                    </div>
                </div>

                <div class="profiles-panel">
                    <div class="palette-section">
                        <div class="palette-header">
                            <div class="palette-title">🎨 Мои цвета</div>
                            <button id="addPaletteColorBtn" class="round-add-btn" title="Добавить цвет">+</button>
                        </div>
                        <div id="paletteList" class="palette-list"></div>
                        <div style="font-size: 10px; color: #7a8494; margin-top: 4px;">макс. 10 цветов · клик на квадрат</div>
                    </div>
                    <div>
                        <div class="profiles-header">
                            <div class="palette-title">⚙️ Ползунки (профили)</div>
                            <button id="newProfileBtn" class="round-add-btn" title="Добавить профиль">+</button>
                        </div>
                        <div id="profileList"></div>
                    </div>
                    <div class="info-hint">✓ Выберите профиль → клик по ячейке (повторно — очистить)</div>
                </div>
            </div>
            <footer>Улучшенный модуль: палитра цветов, ползунки с процентами, градиенты</footer>
        </div>

        <div id="workPage" class="page">
            <div class="work-single-panel">
                <div class="stats-bar">
                    <div class="stats-left">
                        <div><span id="workStats">Комбинаций: 0 / 1326</span></div>
                    </div>
                    <div class="rng-widget" id="rngNumber">42</div>
                </div>
                <div id="workGrid" class="hands-grid readonly"></div>
                <div id="workLevelsContainer"></div>
                <footer>Режим просмотра • многоуровневая навигация</footer>
            </div>
        </div>
    </div>
   <script src="js/all.js"></script>
</body>
</html>
