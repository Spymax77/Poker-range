<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля - PFRangeTool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="auth-dialog reset-password-page">
        <h2>Новый пароль</h2>
        <form id="resetPasswordForm">
            <label>Пароль
                <input id="resetPassword" type="password" minlength="8" required autocomplete="new-password">
            </label>
            <label>Повтор пароля
                <input id="resetPasswordConfirm" type="password" minlength="8" required autocomplete="new-password">
            </label>
            <div class="auth-dialog-error" id="resetPasswordError"></div>
            <button class="auth-submit" type="submit">Сменить пароль</button>
        </form>
    </main>
    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('resetPasswordForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            var errorElement = document.getElementById('resetPasswordError');
            var password = document.getElementById('resetPassword').value;
            var passwordConfirm = document.getElementById('resetPasswordConfirm').value;
            if (password !== passwordConfirm) {
                errorElement.textContent = 'Пароли не совпадают';
                return;
            }
            var token = new URLSearchParams(window.location.search).get('token');
            if (!token) {
                errorElement.textContent = 'В ссылке отсутствует токен';
                return;
            }
            var result = await App.auth.resetPassword(token, password, passwordConfirm);
            if (result && result.success) {
                errorElement.textContent = '';
                document.getElementById('resetPasswordForm').innerHTML =
                    '<p>Пароль изменён. Теперь можно войти на главной странице.</p>' +
                    '<a class="auth-link" href="/">Перейти ко входу</a>';
            } else {
                errorElement.textContent = (result && (result.error || result.message)) || 'Не удалось изменить пароль';
            }
        });
    </script>
</body>
</html>
