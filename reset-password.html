<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="reset.title">Сброс пароля - PFRangeTool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="auth-dialog reset-password-page">
        <h2 data-i18n="reset.heading">Новый пароль</h2>
        <form id="resetPasswordForm">
            <label><span data-i18n="reset.password">Пароль</span>
                <input id="resetPassword" type="password" minlength="8" required autocomplete="new-password">
            </label>
            <label><span data-i18n="reset.passwordConfirm">Повтор пароля</span>
                <input id="resetPasswordConfirm" type="password" minlength="8" required autocomplete="new-password">
            </label>
            <div class="auth-dialog-error" id="resetPasswordError"></div>
            <button class="auth-submit" type="submit" data-i18n="reset.submit">Сменить пароль</button>
        </form>
    </main>
    <script src="js/store.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('resetPasswordForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            var errorElement = document.getElementById('resetPasswordError');
            var password = document.getElementById('resetPassword').value;
            var passwordConfirm = document.getElementById('resetPasswordConfirm').value;
            if (password !== passwordConfirm) {
                errorElement.textContent = App.i18n.t('reset.passwordsMismatch');
                return;
            }
            var token = new URLSearchParams(window.location.search).get('token');
            if (!token) {
                errorElement.textContent = App.i18n.t('reset.tokenMissing');
                return;
            }
            var result = await App.auth.resetPassword(token, password, passwordConfirm);
            if (result && result.success) {
                errorElement.textContent = '';
                document.getElementById('resetPasswordForm').innerHTML =
                    '<p>' + App.i18n.t('reset.success') + '</p>' +
                    '<a class="auth-link" href="/">' + App.i18n.t('reset.goToLogin') + '</a>';
            } else {
                errorElement.textContent = (result && (result.error || result.message)) || App.i18n.t('reset.genericError');
            }
        });
    </script>
</body>
</html>
